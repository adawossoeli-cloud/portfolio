name: Portfolio Quality Checks

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify portfolio files
        run: |
          for file in index.html cv.html style.css script.js README.md; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done
          echo "Portfolio files are present."
      - name: Check responsive CSS
        run: grep -q "@media" style.css

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for obvious unsafe JavaScript patterns
        run: |
          if grep -E "eval\(|document\.write\(" script.js; then
            echo "Review potentially unsafe JavaScript patterns."
            exit 1
          fi